[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tradsys"
version = "1.0.0"
description = "Institutional-grade live algorithmic trading system"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.28.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "uvloop>=0.19",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "pandas-ta>=0.3",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
ib = ["ib_insync>=0.9.86"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
